name: Reporte de bug
description: Algo no funciona como debería en SoundClear
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: descripcion
    attributes:
      label: Descripción
      description: Qué pasó y qué esperabas que pasara
      placeholder: "Ej.: al reproducir una playlist desde la búsqueda, salta a la primera canción en lugar de la seleccionada…"
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Cómo llegar al bug
      placeholder: |
        1. Ve a Búsqueda y busca "lofi"
        2. Pulsa en un track
        3. ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamiento esperado
      description: Qué debería ocurrir
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamiento actual
      description: Qué ocurre en realidad (incluye mensajes de error si los hay)
    validations:
      required: true
  - type: dropdown
    id: entorno
    attributes:
      label: Entorno
      description: Dónde ocurre el bug
      options:
        - Web (navegador)
        - App de escritorio
        - Ambos
      default: 0
    validations:
      required: true
  - type: input
    id: navegador
    attributes:
      label: Navegador / SO (si aplica)
      description: "Ej.: Chrome 126 en macOS 14"
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Información extra
      description: Capturas, consola, consola de red, etc.
    validations:
      required: false
