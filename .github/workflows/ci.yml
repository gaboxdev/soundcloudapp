name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si se empuja dos veces seguidas, la primera se cancela: solo cuenta la última.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run release:check
      - run: npm run i18n -- --estricto
      - run: npm run css:audit -- --estricto
      - run: npm audit --audit-level=high

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w @soundclear/proxy-worker
      - run: npx wrangler deploy --dry-run
        working-directory: proxy/worker
