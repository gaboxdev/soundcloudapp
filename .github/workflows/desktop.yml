name: Desktop

# El Rust es la parte cara de construir (toolchain + compilacion completa en dos
# sistemas). Solo se dispara cuando se toca algo del escritorio, para no gastar
# minutos de Actions en cada push de la web.
on:
  push:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/web/src/**'
      - 'packages/soundcloud-api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/desktop/**'
      - 'apps/web/src/**'
      - 'packages/soundcloud-api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - run: npm run build
      - run: cargo check --locked
        working-directory: apps/desktop/src-tauri
      - run: cargo test --locked
        working-directory: apps/desktop/src-tauri
