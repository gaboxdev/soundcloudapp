name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Etiqueta a publicar (v0.1.0)'
        required: true

# Una etiqueta, una corrida. La segunda espera: cancelarla a medias dejaría un borrador a medias.
concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:check -- "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run i18n -- --estricto
      - run: npm audit --audit-level=high

  # Un solo borrador, creado aquí, antes de compilar. Si macOS, Windows y Linux
  # llaman a tauri-action a la vez con releaseDraft, las que pierden la carrera
  # de crear la release fallan y sus binarios no se suben.
  draft:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Crear o reutilizar el borrador
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "Etiqueta no válida: $TAG" >&2
            exit 1
          fi
          notes="${RUNNER_TEMP}/release-notes.md"
          cat > "$notes" <<'EOF'
          macOS universal (Apple Silicon e Intel), Windows x64 (`.exe` de NSIS y `.msi`) y Linux x64 (`.deb` y `.AppImage`).

          **El binario no está firmado ni notarizado.**

          macOS lo bloquea la primera vez. Copia SoundClear a Aplicaciones y ábrelo con clic derecho › **Abrir**. Si no sale esa opción: Ajustes del Sistema › Privacidad y seguridad › **Abrir igualmente**. O quita la cuarentena:

          `xattr -dr com.apple.quarantine /Applications/SoundClear.app`

          **Windows: el binario no está firmado.** SmartScreen puede avisar: **Más información** › **Ejecutar de todas formas**. El instalador NSIS descarga WebView2 si falta.

          **Linux** no está validado en un escritorio real. El `.deb` se instala con `sudo apt install ./soundclear_*.deb`. El `.AppImage` necesita permiso de ejecución. En Wayland el cristal de la ventana depende del compositor.

          Proyecto independiente, sin afiliación con SoundCloud.
          EOF
          line=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name==\"${TAG}\") | \"\(.id) \(.draft)\"")
          if [ -z "$line" ]; then
            payload="${RUNNER_TEMP}/release.json"
            jq -n \
              --arg tag "$TAG" \
              --arg name "SoundClear ${TAG}" \
              --arg target "$GITHUB_SHA" \
              --rawfile body "$notes" \
              '{tag_name:$tag, name:$name, target_commitish:$target, draft:true, body:$body}' \
              > "$payload"
            id=$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input "$payload" --jq .id)
            state=true
          else
            id=${line%% *}
            state=${line##* }
          fi
          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "No se obtuvo el id de la release ${TAG}." >&2
            exit 1
          fi
          # Una release ya publicada (v0.1.0 es solo macOS) no se reescribe desde aquí.
          if [ "$state" != "true" ]; then
            echo "La release ${TAG} ya está publicada. Este workflow no la modifica: etiqueta una versión nueva." >&2
            exit 1
          fi
          echo "release_id=${id}" >> "$GITHUB_OUTPUT"
          echo "Borrador ${TAG}: ${id}"

  macos:
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.draft.outputs.release_id }}
          # No hay plugin de updater: sin esto los tres jobs se pisan subiendo latest.json.
          includeUpdaterJson: false
          retryAttempts: 2
          args: --target universal-apple-darwin

  linux:
    needs: draft
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      # rpm queda fuera: el runner no trae rpmbuild y las notas solo prometen deb y AppImage.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.draft.outputs.release_id }}
          includeUpdaterJson: false
          retryAttempts: 2
          args: --bundles deb,appimage

  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/desktop/src-tauri

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      # NSIS (.exe) y WiX (.msi), explícitos, para que un cambio de targets no se deje uno fuera.
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.draft.outputs.release_id }}
          includeUpdaterJson: false
          retryAttempts: 2
          args: --bundles nsis,msi
