name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run release:check -- "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run i18n -- --estricto
      - run: npm audit --audit-level=high

  macos:
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: SoundClear ${{ github.ref_name }}
          releaseDraft: true
          args: --target universal-apple-darwin
          releaseBody: |
            macOS universal (Apple Silicon e Intel) y Windows x64 (`.exe` y `.msi`).

            **El binario no está firmado ni notarizado.** macOS lo va a bloquear la primera vez:
            abre el `.app` con clic derecho › **Abrir**, o quita la cuarentena con
            `xattr -dr com.apple.quarantine /Applications/SoundClear.app`.

            **Windows: el binario no está firmado.** SmartScreen puede avisar:
            **Más información** › **Ejecutar de todas formas**.
            El instalador descarga WebView2 si falta.

            Proyecto independiente, sin afiliación con SoundCloud.

  windows:
    needs: validate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - run: npm ci

      - run: npm run typecheck
      - run: npm test

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: SoundClear ${{ github.ref_name }}
          releaseDraft: true
          releaseBody: |
            macOS universal (Apple Silicon e Intel) y Windows x64 (`.exe` y `.msi`).

            **El binario no está firmado ni notarizado.** macOS lo va a bloquear la primera vez:
            abre el `.app` con clic derecho › **Abrir**, o quita la cuarentena con
            `xattr -dr com.apple.quarantine /Applications/SoundClear.app`.

            **Windows: el binario no está firmado.** SmartScreen puede avisar:
            **Más información** › **Ejecutar de todas formas**.
            El instalador descarga WebView2 si falta.

            Proyecto independiente, sin afiliación con SoundCloud.
